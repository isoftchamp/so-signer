# Obfuscate application classes without shrinking or optimizing them. This is
# deliberately conservative because JavaFX, FXML, JNI, and unidbg use reflection.
-dontshrink
-dontoptimize

# Some unidbg dependencies contain optional references that are unavailable on
# this desktop runtime. They are unchanged library classes, not application code.
-dontwarn

# Preserve metadata used by JavaFX, reflection, generic signatures, and services.
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
-adaptclassstrings
-adaptresourcefilecontents **.fxml,META-INF/services/**

# Java 9+ runtime classes are stored in JMOD files.
-libraryjars '<java.home>/jmods/java.base.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.desktop.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.logging.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.management.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.naming.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.prefs.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.sql.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.xml.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/jdk.unsupported.jmod'(!**.jar;!module-info.class)

# The manifest and jpackage refer to this entry point by its original name.
-keep class com.example.signer.so.Launcher {
    public static void main(java.lang.String[]);
}

# JavaFX discovers the Application lifecycle reflectively.
-keep class com.example.signer.so.App {
    public <init>();
    public void start(javafx.stage.Stage);
    public void stop();
    public static void main(java.lang.String[]);
}

# FXML contains these class and member names. Keeping both controllers avoids
# brittle runtime failures while allowing the rest of the application to be
# renamed.
-keep class com.example.signer.so.PrimaryController { *; }
-keep class com.example.signer.so.SettingsController { *; }
-keepclassmembers class * {
    @javafx.fxml.FXML *;
}

# The Android library registers this JNI contract by class and method name.
-keep class com.example.signer.so.NativeMediaProcessor { *; }
-keepclasseswithmembernames,includedescriptorclasses class * {
    native <methods>;
}

# The Maven plugin writes target/proguard_map.txt for decoding stack traces.
# Keep that mapping private and do not distribute it with the application.
